  // transform: the ramp shuts first, then lift-off, wings spread, fins swing out (and the reverse to dock)
  if (FORM.t !== FORM.target && (FORM.target === 0 || DOOR.open < 0.02)) {
    FORM.t += Math.sign(FORM.target - FORM.t) * Math.min(Math.abs(FORM.target - FORM.t), dt / 3.2); setForm(FORM.t);
  }
  const ly = 1.5 * sstep(0, 0.4, FORM.t) + Math.sin(now / 900) * 0.06 * sstep(0.85, 1, FORM.t);
  if (ly !== ship.position.y) { ship.position.y = ly; ship.userData.clip.sync(); }   // the dome's clip planes are world space
  if (mode === 'overview') {
    controls.target.y += (0.6 + ship.position.y - controls.target.y) * Math.min(1, dt * 3);
    if (dollyLeft) { const st = Math.sign(dollyLeft) * Math.min(Math.abs(dollyLeft), dt * 0.45); dollyLeft -= st; camera.position.sub(controls.target).multiplyScalar(Math.exp(st)).add(controls.target); }
  }
  const was = DOOR.open; DOOR.open += Math.sign(DOOR.target - DOOR.open) * Math.min(Math.abs(DOOR.target - DOOR.open), dt * 0.9);
  if (DOOR.open !== was || !frame.init) { applyDoor(); frame.init = true; }
  for (const F of FANS) F.g.rotation.y += dt * 1.4 * F.s;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
applyDoor();
requestAnimationFrame(frame);
setTimeout(() => document.getElementById('boot').classList.add('gone'), 150);
window.__BV = { scene, camera, controls, player, DOOR, FORM, setForm, bFly, setMode, ship, ROOF, free, floorAt, sit, SEATS, bWalk, toOverview };
</script>
